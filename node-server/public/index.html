<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h2 {
      margin-bottom: 10px;
      color: #2E7D32;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
      margin-bottom: 12px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #4CAF50;
      outline: none;
      box-shadow: 0 0 0 2px rgba(76,175,80,0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #43a047;
    }

    button:active {
      transform: scale(0.98);
    }

    .msg {
      margin-top: 15px;
      font-size: 14px;
      min-height: 18px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .loader {
      display: none;
      margin-top: 10px;
      font-size: 13px;
      color: #777;
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">
      <h2>💸 Expense Tracker</h2>
      <div class="subtitle">Quickly log today's expense</div>

      <input 
        type="number" 
        id="amount" 
        placeholder="Enter amount (₹)" 
      />

      <button onclick="submitExpense()">Add Expense</button>

      <div class="loader" id="loader">Updating...</div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    async function submitExpense() {
      const amountInput = document.getElementById("amount");
      const msg = document.getElementById("msg");
      const loader = document.getElementById("loader");

      const amount = amountInput.value;

      msg.innerText = "";
      msg.className = "msg";

      if (!amount || amount <= 0) {
        msg.innerText = "Enter a valid amount";
        msg.classList.add("error");
        return;
      }

      const today = new Date().toISOString().split("T")[0];

      loader.style.display = "block";

      try {
        const res = await fetch("/api/add-expense", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: Number(amount),
            date: today
          })
        });

        const data = await res.json();

        if (res.ok) {
          msg.innerText = "✅ Expense added!";
          msg.classList.add("success");
          amountInput.value = "";
        } else {
          msg.innerText = data.error || "Something went wrong";
          msg.classList.add("error");
        }

      } catch (err) {
        msg.innerText = "Server error";
        msg.classList.add("error");
      }

      loader.style.display = "none";
    }
  </script>

</body>
</html>
