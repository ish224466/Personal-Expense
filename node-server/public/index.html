<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Expense Tracker</title>

<style>
:root {
  --primary: #4CAF50;
  --bg: #0f172a;
  --card: #111827;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --accent: #22c55e;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
}

body {
  background: linear-gradient(180deg, #0f172a, #020617);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 16px;
}

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

h2 {
  font-size: 18px;
}

.refresh {
  font-size: 14px;
  color: var(--accent);
  cursor: pointer;
}

.total {
  font-size: 28px;
  font-weight: bold;
  margin-top: 10px;
  color: var(--accent);
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
  background: #1f2937;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin-top: 12px;
  background: var(--primary);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

button:active {
  transform: scale(0.97);
}

.list {
  max-height: 320px;
  overflow-y: auto;
  margin-top: 10px;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  background: #1f2937;
  transition: 0.2s;
}

.item:hover {
  background: #374151;
}

.date {
  color: var(--muted);
  font-size: 14px;
}

.expense {
  font-weight: bold;
  font-size: 15px;
}

.msg {
  margin-top: 10px;
  font-size: 13px;
}

@media (max-width: 480px) {
  .container {
    padding: 12px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- Add Expense -->
  <div class="card">
    <h2>Add Expense</h2>
    <input type="number" id="amount" placeholder="Enter amount ₹"/>
    <button onclick="addExpense()">Add Expense</button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- Monthly Summary -->
  <div class="card">
    <div class="header">
      <h2>This Month</h2>
      <div class="refresh" onclick="loadData()">⟳ Refresh</div>
    </div>
    <div class="total" id="total">₹0</div>
  </div>

  <!-- Expense List -->
  <div class="card">
    <h2>History</h2>
    <div class="list" id="list"></div>
  </div>

</div>

<script>

async function addExpense() {
  const amount = document.getElementById("amount").value;
  const msg = document.getElementById("msg");

  if (!amount || amount <= 0) {
    msg.innerText = "Enter valid amount";
    return;
  }

  const today = new Date().toISOString().split("T")[0];

  await fetch("/api/add-expense", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ amount: Number(amount), date: today })
  });

  msg.innerText = "Added ✅";
  document.getElementById("amount").value = "";

  loadData();
}

async function loadData() {
  const res = await fetch("/api/month-expenses");
  const data = await res.json();

  document.getElementById("total").innerText = "₹" + data.total;

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.expenses.slice().reverse().forEach(item => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <div class="date">${item.date}</div>
      <div class="expense">₹${item.expense}</div>
    `;

    list.appendChild(div);
  });
}

loadData();

</script>

</body>
</html>
